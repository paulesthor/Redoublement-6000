<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WikiMasters">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0b">
<title>WikiMasters</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth" class="auth">
  <h1>WIKIMASTERS</h1>
  <p class="mut">Les articles de Wikipédia en cartes à collectionner.</p>
  <input id="a-name" placeholder="Pseudo" autocomplete="username">
  <input id="a-pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <input id="a-invite" placeholder="Code d'invitation (si demandé)">
  <div class="row"><button id="a-login">Connexion</button><button id="a-register" class="plain">Créer un compte</button></div>
  <p id="a-err" class="err"></p>
  <p id="a-friend" class="mut" hidden>Connecte-toi ou crée un compte pour ajouter cet ami.</p>
</div>
<div id="app" hidden>
  <aside>
    <div class="logo">WIKIMASTERS</div>
    <nav>
      <button data-tab="packs"><span class="t">Boosters</span></button>
      <button data-tab="album"><span class="t"><span class="lg">Collection</span><span class="sh">Cartes</span></span></button>
      <button data-tab="duel"><span class="t">Combats</span></button>
      <button data-tab="market"><span class="t">Enchères</span></button>
      <button data-tab="trades"><span class="t">Échanges</span></button>
      <button data-tab="friends"><span class="t">Amis</span></button>
      <button data-tab="rank"><span class="t"><span class="lg">Classement</span><span class="sh">Top</span></span></button>
    </nav>
    <div id="me"></div>
  </aside>
  <div class="content">
    <div id="hits"><span class="hits-label">HITS<br>LÉGENDAIRES</span><span id="hits-text" class="mut">Les prochains tirages légendaires apparaîtront ici.</span></div>
    <main id="view"></main>
  </div>
</div>
<div id="banner" hidden></div>
<div id="toast"></div>
<div id="modal" hidden></div>
<script src="qrcode.js"></script>
<script src="reveal.js"></script>
<script src="app.js"></script>
</body>
</html>
