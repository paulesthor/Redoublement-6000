<script>
/* préférences d'affichage appliquées avant le premier affichage (pas de flash) : thème, taille du texte, animations, vibrations */
window.THEME_BG = { dark: '#07070b', midnight: '#000000', ocean: '#050b14', forest: '#050d09', violet: '#0b0714', light: '#f2f1ee', beige: '#efe6d3' };
window.applyPrefs = function () {
  var g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, r = document.documentElement;
  var th = g('wm_theme') || 'dark'; if (th === 'auto') th = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  if (!window.THEME_BG[th]) th = 'dark';
  r.dataset.theme = th; r.dataset.text = g('wm_text') || 'm'; r.dataset.motion = g('wm_motion') === '0' ? 'off' : 'on';
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = window.THEME_BG[th];
  if (g('wm_vibe') === '0') navigator.vibrate = function () { return false; };
};
window.applyPrefs();
</script>

<div id="auth" class="auth">
  <div class="auth-card">
    <div class="wordmark big"><span>CLODO</span><b>WIKI</b></div>
    <p class="tagline">Les articles de Wikipédia deviennent ta collection de cartes.</p>
    <input id="a-name" placeholder="Pseudo" autocomplete="username">
    <input id="a-pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <input id="a-invite" placeholder="Code d'invitation (si demandé)">
    <button id="a-login" class="cta">Connexion</button>
    <button id="a-register" class="plain">Créer un compte</button>
    <p id="a-err" class="err"></p>
    <p id="a-friend" class="mut" hidden>Connecte-toi ou crée un compte pour ajouter cet ami.</p>
  </div>
</div>

<div id="app" hidden>
  <aside>
    <div class="wordmark"><span>CLODO</span><b>WIKI</b></div>
    <nav>
      <button data-tab="packs"><span class="t"><svg class="ic"><use href="#i-packs"/></svg></span><em>Boosters</em></button>
      <button data-tab="album"><span class="t"><svg class="ic"><use href="#i-album"/></svg></span><em>Collection</em></button>
      <button data-tab="search" class="x"><span class="t"><svg class="ic"><use href="#i-search"/></svg></span><em>Chercher</em></button>
      <button data-tab="duel"><span class="t"><svg class="ic"><use href="#i-duel"/></svg></span><em>Combats</em></button>
      <button data-tab="rank" class="x"><span class="t"><svg class="ic"><use href="#i-trophy"/></svg></span><em>Top</em></button>
      <button data-tab="market"><span class="t"><svg class="ic"><use href="#i-market"/></svg></span><em>Marché</em></button>
      <button data-tab="msg" class="x"><span class="t"><svg class="ic"><use href="#i-chat"/></svg></span><em>Messages</em></button>
      <button data-tab="friends" class="x"><span class="t"><svg class="ic"><use href="#i-friends"/></svg></span><em>Amis</em></button>
      <button data-tab="more" class="more" aria-haspopup="dialog"><span class="t"><svg class="ic"><use href="#i-more"/></svg></span><em>Plus</em></button>
    </nav>
  </aside>
  <div class="content">
    <div id="topbar">
      <div class="wordmark sm"><span>CLODO</span><b>WIKI</b></div>
      <div id="me"></div>
    </div>
    <div id="hits"><span class="hits-label">Hits<br>légendaires</span><span id="hits-text" class="mut">Les prochains tirages légendaires apparaîtront ici.</span></div>
    <main id="view"></main>
  </div>
</div>
<div id="boot" class="mut" style="text-align:center;margin-top:30vh" hidden>Chargement…</div>
<div id="scan-overlay" hidden>
  <video id="scan-video" playsinline muted></video>
  <div class="scan-frame"></div>
  <div class="scan-top"><span>Scanne le QR code de ton ami</span><button id="scan-close" aria-label="Fermer">✕</button></div>
  <div id="scan-hint"></div>
</div>
<div id="banner" hidden></div>
<div id="toast"></div>
<div id="modal" hidden></div>

<script src="reveal.js"></script>
<script src="changelog.js"></script>

</html>
